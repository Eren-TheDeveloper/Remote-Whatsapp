    <text x="58" y="257" fill="#7ce9ac" font-size="29" font-weight="600">tek tık uzağında.</text>
    <text x="58" y="310" fill="#b1d3c5" font-size="17">Oluştur. Kişiselleştir. Gönder.</text>
    <rect x="58" y="359" width="232" height="44" rx="12" fill="#7ce9ac"/>
    <text x="80" y="387" fill="#073d2f" font-size="16" font-weight="700">Senin mesajın. Senin stilin.</text>
    <rect x="636" y="63" width="508" height="369" rx="18" fill="#001d18" opacity=".28"/>
    <rect x="622" y="49" width="508" height="369" rx="18" fill="url(#card)"/>
    <path d="M640 49h472a18 18 0 0 1 18 18v33H622V67a18 18 0 0 1 18-18" fill="#e1eee7"/>
    <circle cx="647" cy="75" r="5" fill="#9db7a8"/>
    <circle cx="664" cy="75" r="5" fill="#9db7a8"/>
    <circle cx="681" cy="75" r="5" fill="#9db7a8"/>
