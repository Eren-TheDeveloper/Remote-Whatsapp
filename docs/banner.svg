    <text x="650" y="139" fill="#6b8376" font-size="12" letter-spacing="1">ALICI</text>
    <text x="883" y="139" fill="#6b8376" font-size="12" letter-spacing="1">SENİN ADIN</text>
    <rect x="650" y="151" width="210" height="39" rx="8" fill="#fff" stroke="#d1e1d7"/>
    <rect x="883" y="151" width="218" height="39" rx="8" fill="#fff" stroke="#d1e1d7"/>
    <text x="664" y="177" fill="#183e2c" font-size="16">Deniz</text>
    <text x="897" y="177" fill="#183e2c" font-size="16">Eren</text>
    <rect x="650" y="211" width="451" height="178" rx="12" fill="#fff" stroke="#d1e1d7"/>
    <text x="671" y="245" fill="#183e2c" font-size="19" font-weight="700">Kendini tanıt</text>
    <rect x="671" y="265" width="347" height="45" rx="10" fill="#def7e6"/>
