<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Remote WhatsApp — Hazır mesajların, tek tık uzağında.</title>
  <desc id="desc">Koyu yeşil zeminde kişiselleştirilebilir mesaj kartını gösteren tanıtım çizimi.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#052e2b"/><stop offset="1" stop-color="#0b5146"/></linearGradient>
    <linearGradient id="card" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f0faf5"/></linearGradient>
  </defs>
  <rect width="1200" height="480" rx="28" fill="url(#bg)"/>
  <circle cx="1130" cy="30" r="235" fill="#73efab" opacity=".055"/>
  <circle cx="30" cy="480" r="210" fill="#73efab" opacity=".05"/>
  <g font-family="Segoe UI, Arial, sans-serif">
